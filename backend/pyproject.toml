[project]
name = "scanforge"
version = "0.1.0"
description = "Scan-to-BIM: LiDAR + 360 video to IFC and Revit, with AI agents"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29",
  "ifcopenshell>=0.8",
  "laspy[lazrs]>=2.5",
  "pye57>=0.4",
  "plyfile>=1.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scanforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.setuptools.package-data]
scanforge = ["web/*.html", "web/vendor/*", "web/vendor/addons/controls/*"]
